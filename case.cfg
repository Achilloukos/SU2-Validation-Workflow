% -------------------- Problem definition -------------------- %
SOLVER= INC_RANS
MATH_PROBLEM= DIRECT
RESTART_SOL= NO

% ------------------------- Mesh ------------------------------ %
MESH_FILENAME= topology.su2
MESH_FORMAT= SU2

% ------------------- Incompressible setup -------------------- %
INC_NONDIM= DIMENSIONAL

INC_DENSITY_INIT= 1.0
INC_VELOCITY_INIT= ( 1.0, 0.0, 0.0 )
INC_TEMPERATURE_INIT= 300.0
INC_ENERGY_EQUATION= NO

VISCOSITY_MODEL= CONSTANT_VISCOSITY
MU_CONSTANT= 1.0e-3

% ------------------- Turbulence model ------------------------ %
% Choose between SST and SA. For SA, comment the line with SST_OPTIONS
KIND_TURB_MODEL= SA
%SST_OPTIONS= V2003m

% ---------------- Boundary conditions (incomp) ---------------- %
% IMPORTANT: number of entries in INC_INLET_TYPE must match the number of inlet markers
INC_INLET_TYPE= VELOCITY_INLET, VELOCITY_INLET, VELOCITY_INLET, VELOCITY_INLET
MARKER_INLET= (inlet1, 300.0, 1.0,  0.0, -1.0, 0.0, inlet2, 300.0, 1.0,  1.0, 0.0, 0.0, inlet3, 300.0, 1.0,  0.0, 1.0, 0.0, inlet4, 300.0, 1.0,  -1.0, 0.0, 0.0)

% IMPORTANT: number of entries in INC_OUTLET_TYPE must match the number of outlet markers
INC_OUTLET_TYPE= PRESSURE_OUTLET, PRESSURE_OUTLET, PRESSURE_OUTLET
MARKER_OUTLET= ( outlet1, 0.0, outlet2, 0.0, outlet3, 0.0 )

% No-slip wall for incompressible NS/RANS typically via HEATFLUX (adiabatic)
MARKER_HEATFLUX= ( wall, 0.0 )
% Adding wall functions IF the mesh is not dense enough near walls, 
% to solve for the different layers of the boundary layer
%MARKER_WALL_FUNCTIONS = (wall,STANDARD_WALL_FUNCTION)

% Turbulence inlet quantities for SST:
% (inlet_marker1, turbulence_intensity1, turb_to_lam_visc_ratio1, ...)
% Turbulence inlet quantities for SA:
% SA Model: (inlet_marker1, NuFactor1, inlet_marker2, NuFactor2, ...)
% In the comments below set the values for either model, the code reads them from the comments
% turbulence_intensity = 0.02, turb_to_lam_visc_ratio = 5
% Nu = 2.5e-4
% For conversion between them: Nu = (mu_t/mu) * (mu/rho)

MARKER_INLET_TURBULENT= ( inlet1, 0.05, 10.0, inlet2, 0.05, 10.0, inlet3, 0.05, 10.0, inlet4, 0.05, 10.0 )


% -------------------- Numerics / convergence ----------------- %
TIME_DISCRE_FLOW= EULER_IMPLICIT
CONV_NUM_METHOD_FLOW= FDS
NUM_METHOD_GRAD= GREEN_GAUSS
CFL_ADAPT = YES
CFL_NUMBER= 2.0
% Parameters of the adaptive CFL number (factor-down, factor-up, CFL min value,
%                                        CFL max value, acceptable linear solver convergence, starting iteration)
CFL_ADAPT_PARAM = (0.5, 2, 0.1, 100000.0)

ITER= 2500
CONV_RESIDUAL_MINVAL= -7.4

% ------------------------- Output ----------------------------- %
CUSTOM_OUTPUTS= 'pinl : MassFlowAvg{PRESSURE}[inlet1];\
                 pout : MassFlowAvg{PRESSURE}[outlet1];\
                 pdrop : Function{pinl-pout};\
                '
SCREEN_OUTPUT= ( INNER_ITER, RMS_PRESSURE, phigh, plow, pdrop )
HISTORY_OUTPUT= ( INNER_ITER, RMS_PRESSURE, RMS_VELOCITY-X, RMS_VELOCITY-Y, CUSTOM )
VOLUME_OUTPUT= ( PRIMITIVE, VORTICITY )
OUTPUT_WRT_FREQ= 50
